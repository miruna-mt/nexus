<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus · Multi-industry Optimization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Left column: controls -->
        <aside class="controls-panel">
            <div class="logo-container">
                <img src="/assets/logo.png" alt="Nexus" class="logo">
            </div>
            <p class="subtitle" style="color: #2c7da0; font-weight: bold;">Multi-industry Optimization Engine</p>

            <!-- Level selector -->
            <div class="level-selector">
                <button class="level-btn active" data-level="demo">Demo</button>
                <button class="level-btn" data-level="parametric">Parametric</button>
                <button class="level-btn" data-level="expert">Expert</button>
            </div>

            <!-- Problem type selector -->
            <div class="selector">
                <label for="problemType">Select a problem type</label>
                <select id="problemType">
                    <option value="" disabled selected>Select a problem type</option>
                    <option value="routing">Route Planning (Routing &amp; Scheduling)</option>
                    <option value="assignment">Resource Allocation</option>
                    <option value="inventory">Inventory Management</option>
                    <option value="portfolio">Portfolio Optimization</option>
                </select>
            </div>

            <!-- Instance selector -->
            <div class="selector">
                <label for="instance">Select a scenario</label>
                <select id="instance" disabled>
                    <option value="" disabled selected>Select a problem type first</option>
                </select>
                <div id="instance-counter" class="instance-counter"></div>
            </div>

            <!-- Problem info card -->
            <div id="info-card" class="info-card" style="display: none;">
                    <h4>📦 Problem Data</h4>
                    <div id="info-content">
                        <p>Loading data...</p>
                    </div>
            </div>

            <!-- Dynamic container for level content -->
            <div id="level-content" class="level-content">
                <!-- Demo/Parametric/Expert HTML will be injected here -->
            </div>

            <!-- Scenario description -->
            <div id="scenario-description" class="scenario-description">
                <p>Select a scenario to see its description</p>
            </div>
        </aside>


        <!-- Right column: results -->
        <main class="results-panel">
            <h3>Results</h3>
            <div id="output" class="output">Select a scenario and level to begin</div>
            <div id="map" style="height: 400px; margin-top: 20px; border-radius: 12px; display: none;"></div>
        </main>

    </div>

    <script src="script.js"></script>
<script>
    window.map = L.map('map').setView([37.9922, -1.1307], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(window.map);
</script>
</body>
</html>
