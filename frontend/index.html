<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus · Optimización multi-industria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Columna Izquierda: Controles -->
        <aside class="controls-panel">
            <div class="logo-container">
                <img src="/assets/logo.png" alt="Nexus" class="logo">
            </div>
            <p class="subtitle" style="color: #2c7da0; font-weight: bold;">Motor de optimización multi-industria</p>

            <!-- Selector de niveles -->
            <div class="level-selector">
                <button class="level-btn active" data-level="demo">Demo</button>
                <button class="level-btn" data-level="parametric">Paramétrico</button>
                <button class="level-btn" data-level="expert">Experto</button>
            </div>

            <!-- Selector de tipo de problema -->
            <div class="selector">
                <label for="problemType">Selecciona un tipo de problema</label>
                <select id="problemType">
                    <option value="" disabled selected>Selecciona un tipo de problema</option>
                    <option value="routing">Planificación de rutas (Routing & Scheduling)</option>
                    <option value="assignment">Asignación de recursos (Resource Allocation)</option>
                    <option value="inventory">Gestión de Inventario (Inventory Management)</option>
                    <option value="portfolio">Optimización de carteras (Portfolio Optimization)</option>
                </select>
            </div>

            <!-- Selector de instancia -->
            <div class="selector">
                <label for="instance">Selecciona un escenario</label>
                <select id="instance">
                    <option value="" disabled selected>Selecciona un escenario</option>
                    <option value="logistics_delivery">🚚 Logística · Reparto Urbano (Routing)</option>
		    <option value="proyectos_equipos">📊 Asignación · Proyectos a Equipos (Assignment)</option>
		    <option value="supermercado">📦 Inventario · Supermercado (Inventory)</option>
                </select>
            </div>

            <!-- Tarjeta informativa del problema -->
            <div id="info-card" class="info-card" style="display: none;">
                    <h4>📦 Datos del problema</h4>
                    <div id="info-content">
                    	<p>Cargando datos...</p>
                    </div>
            </div>

            <!-- Contenedor dinámico para el contenido según nivel -->
            <div id="level-content" class="level-content">
                <!-- Aquí se inyectará el HTML de Demo/Paramétrico/Experto -->
            </div>

            <!-- Descripción del escenario -->
            <div id="scenario-description" class="scenario-description">
                <p>Selecciona un escenario para ver su descripción</p>
            </div>
        </aside>


        <!-- Columna Derecha: Resultados -->
        <main class="results-panel">
            <h3>Resultados</h3>
            <div id="output" class="output">Selecciona un escenario y nivel para comenzar</div>
            <div id="map" style="height: 400px; margin-top: 20px; border-radius: 12px; display: none;"></div>
        </main>

    </div>

    <script src="script.js"></script>
<script>
    window.map = L.map('map').setView([37.9922, -1.1307], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(window.map);
</script>
</body>
</html>
